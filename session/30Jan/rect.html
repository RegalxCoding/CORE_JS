<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Rectangle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 20px;
        }
        input {
            padding: 8px;
            margin: 10px;
            width: 80px;
            font-size: 16px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #rectangle {
            margin-top: 20px;
            background: red;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Enter Length & Breadth to Draw a Rectangle</h2>
    Length (px): <input type="number" id="length" min="10" >
    Breadth (px): <input type="number" id="breadth" min="10">
    <button onclick="drawRectangle()">Draw</button>

    <div id="rectangle"></div>

    <script>
        function drawRectangle() {
            let length = parseInt(document.getElementById("length").value);
            let breadth = parseInt(document.getElementById("breadth").value);

            if (isNaN(length) || isNaN(breadth) || length <= 0 || breadth <= 0) {
                alert("Please enter valid positive numbers!");
                return;
            }

            let rect = document.getElementById("rectangle");
            rect.style.width = length + "cm";
            rect.style.height = breadth + "cm";
            rect.style.display = "block";
        }
    </script>

</body>
</html>
