<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        form{
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 30%;
            padding: 30px;
            background: linear-gradient(to right, rgb(242, 135, 206),rgb(255, 217, 0));
        }
        input{
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <h2>Js Arrow FUnctions</h2>

    <form action="#">
        Enter a Number1<input type="number"id="text1"/><br>
        Enter a Number2<input type="number"id="text2"/><br>
        <input type="button"id="btn" value="Add" onclick="addClickHandler()"/>
        <br><div id="result"></div>
    </form>
    <script>
        const add=(x,y)=>{return x+y};
        function addClickHandler(){
            let n1=parseInt(document.getElementById('text1').value)||0;
             let n2=parseInt(document.getElementById('text2').value)||0;
            // add=n1+n2;
            // document.getElementById("result").innerHTML=`Result: ${sum}`;
            let resadd=add(n1,n2);
            document.getElementById("result").innerHTML=resadd;
        }
    </script>
     <form action="#" style="padding: 30px;margin-top: 20px;">
        Enter a Number to gets its square<input type="number"id="num"/><br>
        <input type="button"id="btn" value="Square" onclick="SquareClickHandler()"/>
        <br><div id="res"></div>
    </form>
    <br>
    <script>
        const sq=(x)=>{return x*x};
        function SquareClickHandler(){
            let n1=parseInt(document.getElementById('num').value)||0;
            // add=n1+n2;
            // document.getElementById("result").innerHTML=`Result: ${sum}`;
            let square=sq(n1);
            document.getElementById("res").innerHTML=square;
        }
    </script>
</body>
</html>
