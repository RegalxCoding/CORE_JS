<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructuring</title>
    <script>
        let student = {
            firstName: "Rushabh",
            age: 20
        };
        let ary = [10, 20, 30]; // Defining the array properly
    </script>
</head>
<body>
    <h1>Destructuring</h1>
    <script>
        // Correct destructuring of student object
        let { firstName, age } = student;
        document.write(`
        <br>First Name: ${firstName}
        <br>Age: ${age}`);

        // Correct destructuring of an array
        let [a, b, c] = ary;
        document.write(`<br>${a}, ${b}, ${c}`);
    </script>
    <h1>Spread Operator</h1>
    <script>
        const bignum=[1000,2000,3000];
        const all=[...ary,...bignum]
        for(element of all){
            document.write(`<br>${element}`);
        }
    </script>
</body>
</html>
