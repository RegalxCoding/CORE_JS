<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(to right, #4A90E2, #50C878);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        h2 {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #50C878;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #3ea764;
        }
        #balance {
            font-size: 20px;
            margin: 15px 0;
        }
        .transactions {
            text-align: left;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
        }
        .transactions p {
            font-size: 14px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏦 Bank Management System</h2>
        <p id="balance">Current Balance: ₹0</p>

        <input type="number" id="amount" placeholder="Enter Amount">
        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>

        <h3>📜 Transaction History</h3>
        <div class="transactions" id="transactionHistory"></div>
    </div>

    <script>
        let balance = 0;
        let transactions = [];

        const updateBalance = () => {
            document.getElementById("balance").innerHTML = `Current Balance: ₹${balance}`;
        };

        const deposit = () => {
            let amount = parseFloat(document.getElementById("amount").value);
            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }
            balance += amount;
            transactions.push(`+ ₹${amount}`);
            updateUI();
        };

        const withdraw = () => {
            let amount = parseFloat(document.getElementById("amount").value);
            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }
            if (amount > balance) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= amount;
            transactions.push(`- ₹${amount}`);
            updateUI();
        };

        const updateUI = () => {
            updateBalance();
            let history = document.getElementById("transactionHistory");
            history.innerHTML = transactions.map(trx => `<p>${trx}</p>`).join("");
            document.getElementById("amount").value = "";
        };

        updateBalance();
    </script>

</body>
</html>
