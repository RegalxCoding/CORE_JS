<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Circle Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .circle-container {
            display: flex;
            justify-content: center;
            background-color: blanchedalmond;
            border-radius: 20px;
            padding: 20px;
        }
        .circle {
            width: 90px;
            height: 90px;
            margin: 10px;
            border-radius: 50%;
            background-color: rgb(51, 51, 69);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }
        .circle:hover {
            background-color: rgb(80, 80, 120);
        }
        #timer {
            font-size: 24px;
            margin: 20px;
            color: red;
        }
    </style>
    <script>
        let timeLeft = 10;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                document.getElementById('timer').innerText = `Time Left: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Game Over! Time's up.");
                    document.querySelectorAll('.circle').forEach(circle => {
                        circle.onclick = null;
                    });
                }
                timeLeft--;
            }, 1000);
        }

        function generateRandomNumber(circleId) {
            let randomNum = Math.floor(Math.random() * 100) + 1;
            document.getElementById(circleId).innerText = randomNum;
            timeLeft = 10;
        }

        window.onload = startTimer;
    </script>
</head>
<body>
    <h1 style="color: rgb(18, 106, 62);">Circle with Random Number Game</h1>
    <div id="timer">Time Left: 10s</div>
    <div class="circle-container">
        <div class="circle" onclick="generateRandomNumber('no1')">
            <div id="no1">40</div>
        </div>
        <div class="circle" onclick="generateRandomNumber('no2')">
            <div id="no2">50</div>
        </div>
        <div class="circle" onclick="generateRandomNumber('no3')">
            <div id="no3">10</div>
        </div>
    </div>
</body>
</html>
