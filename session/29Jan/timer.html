<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <script>
        var r = 0;

        function changeColor() {
            document.body.style.backgroundColor = `rgb(${r}, 0, 0)`; // Set background color
            r = (r + 50) % 256; // Increment r and loop back within 0-255
        }

        setInterval(changeColor, 1000); // Call function every second
    </script>
</head>
<body>

</body>
</html>
