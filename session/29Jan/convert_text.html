<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert to Uppercase</title>
    <style>
        input{
            padding: 10px;
        }
    </style>
    <script>
        function convertToUppercase() {
            let inputField = document.getElementById("textBox");
            inputField.value = inputField.value.toUpperCase();
        }
    </script>
</head>
<body>

    <h2>Enter Text to convert to Upper Case:</h2>
    <input type="text" id="textBox" onblur="convertToUppercase()" placeholder="Type something...">
    
</body>
</html>
