<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script>
        function submitForm() {
            // event.preventDefault(); // Prevent form submission and page reload

            const User = 'rush';
            const Pass = '123';

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const resultDiv = document.querySelector(".result");

            if (username === User && password === Pass) {
                // alert("Login Successful! 😊");
                resultDiv.innerHTML = `<img src="/session/smily-emoji-yellow-color_970137-97528.avif" width=100% height=100%`;

            } else {
                alert("Invalid username or password!");
                resultDiv.innerHTML = "<h3 style='color: red;'>Login Failed</h3>";
            }
        }
    </script>
</head>
<body>
    <div class="form-container">
        <form action="#">  
            <h2>LOGIN</h2>
        
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter Username" autocomplete="off">
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" autocomplete="off">
            <br>
            <input type="submit" value="Login" onclick="submitForm()">
            <div class="result" style="width:100px; height: 100px; border: 1px solid black;">
                img will shown here
            </div>
        </form>
        
        
    </div>
</body>
</html>
