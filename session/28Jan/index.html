<head>

    <title>Document</title>
    <style>

            flex-direction: column;

            background-image: url(.//photos/12628435_5026563.jpg);

        h3{

            border-radius: 7px;

        h3:hover{

       .info{

        color: rgba(156, 12, 38, 0.901);

        display: flex;

       }

        font-size: 25px;
        background-color: rgba(240, 240, 227, 0.632);
        color: rgba(11, 23, 132, 0.738);

        width: 500px;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
        margin-top: 10px;

        justify-content: center;
        background-color: rgb(217, 135, 135);
        color: rgb(41, 3, 3);

</head>
<body>
    <div class="info">
