<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case Example</title>
    <link rel="stylesheet" href="./form.css">
    <script>
        
        var array=[2,3,4,3,43,543,54,34];
        let sum=0;
        document.write("#Array elements:<br>");
        for (let i=0;i<array.length;i++){
            document.writeln(array[i]+" , ");
            sum+=array[i];

        }
        document.write("<br>#sum = "+sum+"<br>");
        array.sort();

        for(let i=0;i<array.length;i++){
            document.writeln(array[i]+" , ");

        }
        array.push(8);
        array.push(999);
        document.writeln("<br>#After Adding some Number:<br>");
        for(let i=0;i<array.length;i++){
            document.writeln(array[i]," ,")
        }
    </script>
</head>
<body>
    
        
</body>
</html>
