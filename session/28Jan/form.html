<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./form.css">
    <script>
        function clickHandler(){
            var name=document.getElementById("firstname").value;
            document.write("<br>Hi"+name);
            alert("Hi "+name)
        }
        function add(){
            var a=10,b=20;
            var c=a+b;
            alert("addition of "+a +"+"+ b+ "= "+c)
        }
        function addition(){    
            const a = document.getElementById("num1");
            const b = document.getElementById("num2");
            let num1 = parseInt(a.value);
            let num2 = parseInt(b.value);
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('result').innerHTML = "<h2>Please enter valid numbers!</h2>";
                return;
            }

            let c = num1 + num2;

            document.getElementById('result').innerHTML = "<h2>" + c + "</h2>";
        }
        function subtract(){
            const a=document.getElementById("num1")
            const b=document.getElementById("num2")
            let num1=parseInt(a.value)
            let num2=parseInt(b.value)
            let c=num1-num2;
            document.getElementById('result').innerHTML="<h2>" + c + "</h2>";

        }
        function multiply(){
            const a=document.getElementById("num1")
            const b=document.getElementById("num2")

            let num1=parseInt(a.value);
            let num2=parseInt(b.value);

            let c=num1*num2
            document.getElementById('result').innerHTML="<h2>"+c+"</h2>";
        }
        function division(){
            const a=document.getElementById("num1")
            const b=document.getElementById("num2")

            let num1=parseInt(a.value);
            let num2=parseInt(b.value);

            let c=num1/num2
            document.getElementById('result').innerHTML="<h2>"+c+"</h2>";
        }
    </script>
    <script>
        function myFunction(){
            document.getElementById("demo").innerHTML="You pressed some key";
        }
    </script>
</head>
<body>
        
    <div class="form-container">
