<!DOCTYPE html>
<html>
    <head>
        <title>Variables</title>
        <style>
           </style>
    </head>
    <body>
         <h1>Cart Quantity</h1>
         <button onclick="console.log(`cart quantity :${cartQuantity}`)">Show Quantity</button>
         <button onclick="
            cartQuantity=cartQuantity+1;
            console.log(`Cart Quantity:${cartQuantity}`)
         ">Add to Cart</button>
         <button onclick="
            cartQuantity=cartQuantity+2;
            console.log(`Cart Quantity:${cartQuantity}`);
         ">+2</button>
         <button onclick="
            cartQuantity=cartQuantity+3;
            console.log(`Cart Quantity:${cartQuantity}`);
         ">+3</button>
         <button onclick="
            cartQuantity=0;
            console.log(`Cart Quantity:${cartQuantity}`);
         ">Reset Button</button>
         <h1>Calculation</h1>
         

         <button onclick="
            calculation+='1';
            console.log(`you click:${calculation}`);
         ">1</button>
         <button onclick="
            calculation+='2';
            console.log(`you click:${calculation}`);
         ">2</button>
         <button onclick="
            calculation+='3';
            console.log(`you click:${calculation}`);
         ">3</button>
         <button onclick="
            calculation+=' + ';
            console.log(`you click:${calculation}`);
         ">+</button>
         <button onclick="
            calculation=eval(calculation);
            console.log(`Result:`+calculation);
         ">=</button>
         <button onclick="
            calculation=0;
            console.log('reset');
         ">clear</button>

            
        <script>
           let cartQuantity=0;
           let calculation='';

            
        </script>
    </body>
</html>
